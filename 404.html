<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Redirecting...</title>
        <script>
            // GitHub Pages SPA 重定向脚本
            // 当用户直接访问子路由时，GitHub Pages 会返回 404
            // 这个脚本会将路径信息保存到 sessionStorage，然后重定向到首页
            // 首页的 JavaScript 会读取这些信息并导航到正确的页面

            var pathSegmentsToKeep = 1; // 保留 /cross-border-ecommerce/ 这一段

            var l = window.location;
            var pathArray = l.pathname.split("/");

            // 构建重定向 URL
            // 将路径信息编码到 search 参数中
            var redirectPath = pathArray.slice(pathSegmentsToKeep + 1).join("/");
            var redirectUrl =
                l.protocol +
                "//" +
                l.hostname +
                (l.port ? ":" + l.port : "") +
                l.pathname
                    .split("/")
                    .slice(0, pathSegmentsToKeep + 1)
                    .join("/") +
                "/" +
                "?/" +
                redirectPath +
                (l.search ? "&" + l.search.slice(1) : "") +
                l.hash;

            // 重定向到首页，带上原始路径信息
            window.location.replace(redirectUrl);
        </script>
    </head>
    <body>
        <p>正在重定向...</p>
    </body>
</html>
